title = "Inferno Custom Gitleaks Config"

[allowlist]
  description = "Global allowlist"
  paths = [
    '''node_modules''',
    '''\.git''',
    '''package-lock\.json''',
    '''yarn\.lock''',
    '''artifacts''',
    '''cache''',
    # Byte-for-byte npm ethers@5.7.2 UMD bundle. Its numeric constants and
    # private-key validation fixtures trigger the generic Ethereum-key rule.
    # tests/browser/web3-write.spec.js pins and verifies the published hash.
    '''docs/assets/vendor/ethers-5\.7\.2\.umd\.min\.js'''
  ]
  regexes = [
    # Public BootstrapVaultV3 finalise() transaction hash, not key material.
    '''0x949848bdd09f4c867a2593afffb0137c7db2c1457d8a8f5ff4428f8ecce69c5f'''
  ]

[[rules]]
  description = "Ethereum Private Key"
  id = "eth-private-key"
  regex = '''(?i)(0x[0-9a-fA-F]{64})'''
  tags = ["key", "ethereum", "crypto"]
  severity = "CRITICAL"

[[rules]]
  description = "Anthropic API Key"
  id = "anthropic-api-key"
  regex = '''sk-ant-[a-zA-Z0-9\-_]{20,}'''
  tags = ["key", "anthropic", "ai"]
  severity = "CRITICAL"

[[rules]]
  description = "Telegram Bot Token"
  id = "telegram-bot-token"
  regex = '''[0-9]{8,10}:AA[a-zA-Z0-9_-]{33}'''
  tags = ["key", "telegram"]
  severity = "CRITICAL"

[[rules]]
  description = "Alchemy API Key"
  id = "alchemy-api-key"
  regex = '''(?i)(alchemy\.com/v2/[a-zA-Z0-9_-]{20,})'''
  tags = ["key", "alchemy"]
  severity = "HIGH"

[[rules]]
  description = "BIP39 Mnemonic Phrase"
  id = "bip39-mnemonic"
  regex = '''(?i)(mnemonic|seed.phrase|seed_phrase)\s*[=:]\s*["']?([a-z]+\s){11,23}[a-z]+["']?'''
  tags = ["key", "wallet", "mnemonic"]
  severity = "CRITICAL"
