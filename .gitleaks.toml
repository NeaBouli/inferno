title = "Inferno Custom Gitleaks Config"

[allowlist]
  description = "Global allowlist"
  paths = [
    '''node_modules''',
    '''\.git''',
    '''package-lock\.json''',
    '''yarn\.lock''',
    '''artifacts''',
    '''cache''',
    # Byte-for-byte npm ethers@6.17.0 UMD bundle. Its numeric constants and
    # private-key validation fixtures trigger the generic Ethereum-key rule.
    # scripts/check-browser-ethers6.cjs pins and verifies the published hash.
    '''docs/assets/vendor/ethers-6\.17\.0\.umd\.min\.js'''
  ]
[[rules]]
  description = "Ethereum Private Key"
  id = "eth-private-key"
  # A bare 32-byte hex value is indistinguishable from a public transaction
  # hash. Require an explicit private/secret-key label and capture only the
  # value so full-history scans keep useful signal without flagging calldata.
  regex = '''(?i)(?:[a-z0-9_-]*(?:private|secret)[_-]?key|private\s+key|secret\s+key|priv[_-]?key|deployer[_-]?key|signer[_-]?key|wallet[_-]?key)\s*(?:=|:|=>)\s*["']?((?:0x)?[0-9a-f]{64})\b'''
  secretGroup = 1
  tags = ["key", "ethereum", "crypto"]
  severity = "CRITICAL"

[[rules]]
  description = "Raw Ethereum Private Key In Credential File"
  id = "eth-private-key-credential-file"
  path = '''(?i)(^|/)(\.env(?:\.[^/]*)?|[^/]+\.(?:key|pem|keystore)|secrets?(?:\.[^/]*)?)$'''
  regex = '''(?i)\b((?:0x)?[0-9a-f]{64})\b'''
  secretGroup = 1
  tags = ["key", "ethereum", "crypto"]
  severity = "CRITICAL"

[[rules]]
  description = "Anthropic API Key"
  id = "anthropic-api-key"
  regex = '''sk-ant-[a-zA-Z0-9\-_]{20,}'''
  tags = ["key", "anthropic", "ai"]
  severity = "CRITICAL"

[[rules]]
  description = "Telegram Bot Token"
  id = "telegram-bot-token"
  regex = '''[0-9]{8,10}:AA[a-zA-Z0-9_-]{33}'''
  tags = ["key", "telegram"]
  severity = "CRITICAL"

[[rules]]
  description = "Alchemy API Key"
  id = "alchemy-api-key"
  regex = '''(?i)(alchemy\.com/v2/[a-zA-Z0-9_-]{20,})'''
  tags = ["key", "alchemy"]
  severity = "HIGH"

[[rules]]
  description = "BIP39 Mnemonic Phrase"
  id = "bip39-mnemonic"
  regex = '''(?i)(mnemonic|seed.phrase|seed_phrase)\s*[=:]\s*["']?([a-z]+\s){11,23}[a-z]+["']?'''
  tags = ["key", "wallet", "mnemonic"]
  severity = "CRITICAL"
