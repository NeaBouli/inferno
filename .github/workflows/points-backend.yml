name: Points Backend CI

on:
  push:
    paths:
      - 'apps/points-backend/**'
      - '.github/workflows/points-backend.yml'
  pull_request:
    paths:
      - 'apps/points-backend/**'
      - '.github/workflows/points-backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/points-backend
    env:
      DATABASE_URL: file:./test.db
      JWT_SECRET: test-secret-32-chars-minimum-here
      VOUCHER_SIGNER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      FEE_ROUTER_ADDRESS: "0x499289C8Ef49769F4FcFF3ca86D4BD7b55B49aa4"
      CHAIN_ID: "11155111"
      PORT: "3004"
      ADMIN_SECRET: "test-admin-secret"
      NODE_ENV: test
      SKIP_LOCK_PROOF: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/points-backend/package-lock.json
      - run: npm ci
      - run: npm run test:dependencies
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit signatures
      - run: npm audit --audit-level=low
      - name: Build production image
        run: docker build -t inferno-points-backend:ci .
      - name: Verify production image fails closed on unsafe configuration
        run: |
          set -euo pipefail
          missing_rpc_log="$(mktemp)"
          unsafe_chain_log="$(mktemp)"
          missing_jwt_log="$(mktemp)"
          trap 'rm -f "$missing_rpc_log" "$unsafe_chain_log" "$missing_jwt_log"' EXIT

          if docker run --rm \
            --network none \
            --tmpfs /data:rw,uid=1001,gid=1001 \
            -e DATABASE_URL=file:/data/ci.db \
            -e JWT_SECRET \
            -e VOUCHER_SIGNER_PRIVATE_KEY \
            -e FEE_ROUTER_ADDRESS \
            -e CHAIN_ID=1 \
            -e IFR_LOCK_ADDRESS=0x769928aBDfc949D0718d8766a1C2d7dBb63954Eb \
            -e SIWE_ALLOWED_ORIGINS=https://ifrunit.tech \
            -e PORT \
            -e ADMIN_SECRET \
            -e NODE_ENV=production \
            inferno-points-backend:ci >"$missing_rpc_log" 2>&1; then
            echo "::error::Production image started without RPC_URL"
            exit 1
          fi
          if ! grep -q '\[security\] RPC_URL is required' "$missing_rpc_log"; then
            cat "$missing_rpc_log"
            echo "::error::Production image failed for an unexpected reason"
            exit 1
          fi

          if docker run --rm \
            --network none \
            --tmpfs /data:rw,uid=1001,gid=1001 \
            -e DATABASE_URL=file:/data/ci.db \
            -e JWT_SECRET \
            -e VOUCHER_SIGNER_PRIVATE_KEY \
            -e FEE_ROUTER_ADDRESS \
            -e CHAIN_ID=11155111 \
            -e RPC_URL=https://sepolia.example \
            -e IFR_LOCK_ADDRESS=0x0000000000000000000000000000000000000001 \
            -e SIWE_ALLOWED_ORIGINS=https://ifrunit.tech \
            -e PORT \
            -e ADMIN_SECRET \
            inferno-points-backend:ci >"$unsafe_chain_log" 2>&1; then
            echo "::error::Production-safe default accepted a non-mainnet configuration"
            exit 1
          fi
          if ! grep -q '\[security\] production CHAIN_ID must be 1' "$unsafe_chain_log"; then
            cat "$unsafe_chain_log"
            echo "::error::Unsafe-chain image failed for an unexpected reason"
            exit 1
          fi

          if docker run --rm \
            --network none \
            --tmpfs /data:rw,uid=1001,gid=1001 \
            -e DATABASE_URL=file:/data/ci.db \
            -e VOUCHER_SIGNER_PRIVATE_KEY \
            -e FEE_ROUTER_ADDRESS \
            -e CHAIN_ID=1 \
            -e RPC_URL=https://mainnet.example \
            -e IFR_LOCK_ADDRESS=0x769928aBDfc949D0718d8766a1C2d7dBb63954Eb \
            -e SIWE_ALLOWED_ORIGINS=https://ifrunit.tech \
            -e PORT \
            -e ADMIN_SECRET \
            inferno-points-backend:ci >"$missing_jwt_log" 2>&1; then
            echo "::error::Production-safe default started without JWT_SECRET"
            exit 1
          fi
          if ! grep -q 'JWT_SECRET is required in production-safe mode' "$missing_jwt_log"; then
            cat "$missing_jwt_log"
            echo "::error::Missing-JWT image failed for an unexpected reason"
            exit 1
          fi
      - name: Smoke production image
        run: |
          set -euo pipefail
          cleanup() {
            docker rm -f inferno-points-backend-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name inferno-points-backend-ci \
            --network none \
            --tmpfs /data:rw,uid=1001,gid=1001 \
            -e DATABASE_URL=file:/data/ci.db \
            -e JWT_SECRET \
            -e VOUCHER_SIGNER_PRIVATE_KEY \
            -e FEE_ROUTER_ADDRESS \
            -e CHAIN_ID \
            -e PORT \
            -e ADMIN_SECRET \
            -e NODE_ENV=test \
            -e SKIP_LOCK_PROOF=true \
            inferno-points-backend:ci

          for attempt in $(seq 1 30); do
            if docker exec inferno-points-backend-ci \
              wget -q -O- http://127.0.0.1:3004/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' inferno-points-backend-ci 2>/dev/null || echo false)" != "true" ]; then
              break
            fi
            sleep 1
          done

          docker logs inferno-points-backend-ci || true
          exit 1
