name: Update On-Chain Stats

on:
  schedule:
    # Täglich um 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manuell auslösbar

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Check Sepolia RPC availability
        id: rpc
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          if [ -n "$SEPOLIA_RPC_URL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SEPOLIA_RPC_URL is unavailable; skipping scheduled stats update."
          fi

      - name: Update on-chain stats
        if: steps.rpc.outputs.available == 'true'
        run: npx hardhat run scripts/update-stats.js --network sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

      - name: Commit updated stats
        if: steps.rpc.outputs.available == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/stats.json docs/TRANSPARENCY.md STATUS-REPORT.md docs/index.html
          git diff --staged --quiet || git commit -m "chore: auto-update on-chain stats [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
