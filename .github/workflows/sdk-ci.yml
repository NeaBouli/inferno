name: IFR SDK CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sdk-bootstrap-publish.sh'
      - 'scripts/test-sdk-bootstrap-publish.cjs'
      - 'apps/sdk/**'
      - 'apps/builder/engine/**'
      - 'test/builder/CodeGeneratorSource.test.cjs'
      - 'test/builder/CodeGeneratorCompile.test.cjs'
      - 'test/builder/compile-harness/**'
      - 'contracts/library/**'
      - 'docs/builder.html'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    paths:
      - 'scripts/sdk-bootstrap-publish.sh'
      - 'scripts/test-sdk-bootstrap-publish.cjs'
      - 'apps/sdk/**'
      - 'apps/builder/engine/**'
      - 'test/builder/CodeGeneratorSource.test.cjs'
      - 'test/builder/CodeGeneratorCompile.test.cjs'
      - 'test/builder/compile-harness/**'
      - 'contracts/library/**'
      - 'docs/builder.html'
      - '.github/workflows/sdk-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: apps/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: apps/sdk/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run test:package
      - run: git diff --exit-code -- dist
      - name: Fail-closed bootstrap publish script (dummy npm, no registry access)
        run: node ../../scripts/test-sdk-bootstrap-publish.cjs
      - name: Publish dry run and tarball listing (no registry write)
        # Shows exactly what `npm publish` would upload; the allowlist itself is enforced by test:package.
        # --provenance=false: provenance is only generated by the OIDC publish job in sdk-publish.yml.
        run: |
          npm pack --dry-run --ignore-scripts
          npm publish --dry-run --ignore-scripts --provenance=false --access public
      - name: Test the real Builder generator source
        run: |
          npx tsc --target ES2020 --module commonjs --esModuleInterop --skipLibCheck \
            --outDir /tmp/ifr-builder-engine ../builder/engine/*.ts
          node ../../test/builder/CodeGeneratorSource.test.cjs /tmp/ifr-builder-engine
      - name: Compile every Builder option combination and check builder.html parity
        run: |
          npm ci --ignore-scripts --prefix ../../test/builder/compile-harness
          npm audit --audit-level=low --prefix ../../test/builder/compile-harness
          node ../../test/builder/CodeGeneratorCompile.test.cjs /tmp/ifr-builder-engine
