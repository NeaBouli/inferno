name: AI Copilot CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop, dev]
    paths:
      - 'apps/ai-copilot/**'
      - '.github/workflows/ai-copilot.yml'
      - 'scripts/check-dev-advisory-exceptions.cjs'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/ai-copilot/**'
      - '.github/workflows/ai-copilot.yml'
      - 'scripts/check-dev-advisory-exceptions.cjs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-copilot
    env:
      ANTHROPIC_API_KEY: "placeholder-not-used-in-build"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ai-copilot/package-lock.json
      - run: npm ci
      - run: npm run test:dependencies
      - run: npm run test:health-shape
      - run: npm run test:cors-origins
      - name: npm audit (production clean; reviewed dev-only exceptions)
        run: node ../../scripts/check-dev-advisory-exceptions.cjs
      - run: npx tsc --noEmit
      - run: npm run check:server-imports
      - run: npm run test:surface-ui
      - run: npm run test:surface-context
      - run: npm run test:liquidity-context
      - run: npm run test:dynamic-intent
      - run: npm run test:daily-budget
      - run: npm run test:live-wiki
      - run: npm run test:chat-budget
      - run: npm run test:correctness
      - run: npm run test:lending-loans
      - run: npm run build
