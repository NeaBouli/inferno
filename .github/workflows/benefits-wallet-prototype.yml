name: Benefits Wallet Prototype

on:
  push:
    branches: [main]
    paths:
      - 'apps/benefits-wallet-prototype/**'
      - 'docs/ifrp-commerce-app/EMBEDDED_WALLET_DECISION.md'
      - 'docs/ifrp-commerce-app/MASTER_ARCHITECTURE.md'
      - 'docs/SHOP_BENEFITS_APP_ARCHITECTURE.md'
      - '.github/workflows/benefits-wallet-prototype.yml'
  pull_request:
    paths:
      - 'apps/benefits-wallet-prototype/**'
      - 'docs/ifrp-commerce-app/EMBEDDED_WALLET_DECISION.md'
      - 'docs/ifrp-commerce-app/MASTER_ARCHITECTURE.md'
      - 'docs/SHOP_BENEFITS_APP_ARCHITECTURE.md'
      - '.github/workflows/benefits-wallet-prototype.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/benefits-wallet-prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/benefits-wallet-prototype/package-lock.json
      - run: npm ci
      - run: node ../../scripts/check-benefits-wallet-advisory-baseline.cjs
      - run: npm test
      - run: npm run test:bundle-boundary
