name: Vault Invariant Monitor

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-invariant-monitor
  cancel-in-progress: false

jobs:
  check-mainnet-vaults:
    name: Check Mainnet vault invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test invariant evaluation
        run: npm run test:vault-invariants
      - name: Check live Mainnet invariants
        run: npm run check:vault-invariants
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
