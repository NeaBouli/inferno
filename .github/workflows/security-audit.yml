name: Security Audit

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify secret-detection configuration
        run: npm run test:gitleaks-config

      - name: Verify workflow token permissions
        run: npm run test:workflow-permissions

      - name: Verify security toolchain pins
        run: npm run test:security-toolchain-pins

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for package.json
        id: check-npm
        run: |
          if [ -f package.json ]; then
            echo "has_npm=true" >> $GITHUB_OUTPUT
          else
            echo "has_npm=false" >> $GITHUB_OUTPUT
          fi

      - name: npm audit (moderate gate)
        if: steps.check-npm.outputs.has_npm == 'true'
        run: npm audit --audit-level=moderate

      - name: Test vault invariant monitor configuration
        if: steps.check-npm.outputs.has_npm == 'true'
        run: npm run test:vault-invariants

      - name: Verify known low-advisory baseline
        if: steps.check-npm.outputs.has_npm == 'true'
        run: npm run test:dependency-advisories

      - name: Check for Cargo.toml
        id: check-cargo
        run: |
          if [ -f Cargo.toml ] || find . -maxdepth 3 -name "Cargo.toml" -print -quit | grep -q .; then
            echo "has_cargo=true" >> $GITHUB_OUTPUT
          else
            echo "has_cargo=false" >> $GITHUB_OUTPUT
          fi

      - name: cargo audit
        if: steps.check-cargo.outputs.has_cargo == 'true'
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Check for requirements.txt
        id: check-pip
        run: |
          if [ -f requirements.txt ] || find . -maxdepth 3 -name "requirements.txt" -print -quit | grep -q .; then
            echo "has_pip=true" >> $GITHUB_OUTPUT
          else
            echo "has_pip=false" >> $GITHUB_OUTPUT
          fi

      - name: pip audit
        if: steps.check-pip.outputs.has_pip == 'true'
        run: |
          python -m pip install pip-audit==2.10.1
          find . -maxdepth 3 -name "requirements.txt" -exec pip-audit -r {} \;

  solidity-static-analysis:
    name: Solidity Static Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install Solidity dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Slither toolchain
        run: |
          python3 -m venv .slither-venv
          .slither-venv/bin/pip install slither-analyzer==0.11.5
          .slither-venv/bin/solc-select install 0.8.28
          .slither-venv/bin/solc-select use 0.8.28
          echo "$PWD/.slither-venv/bin" >> "$GITHUB_PATH"

      - name: Test Slither baseline policy
        run: npm run test:slither-baseline

      - name: Check for new Slither High signals
        run: npm run check:slither

  security-summary:
    name: Security Summary
    runs-on: ubuntu-24.04
    needs: [secret-scan, dependency-audit, solidity-static-analysis]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Solidity Static Analysis | ${{ needs.solidity-static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
