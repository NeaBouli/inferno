name: IFR SDK Publish

# Publishes ifr-sdk to npm only when an owner pushes a tag sdk-v<version> that matches apps/sdk/package.json.
# Requires the repository secret NPM_TOKEN (npm automation token of the project npm organization) and the
# protected environment "npm-release" (owner approval before the job runs). Never commit a registry token.
on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    defaults:
      run:
        working-directory: apps/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: apps/sdk/package-lock.json
      - name: Tag must match package version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "sdk-v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != sdk-v${version}"; exit 1; }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run test:package
      - run: npm pack --dry-run --ignore-scripts
      - name: Publish with provenance
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
