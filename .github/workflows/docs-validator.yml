name: Docs Validator

on:
  push:
    branches: [main, master, develop, dev]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'audit/markdownlint-baseline.json'
      - 'internal/operations/TODO.md'
      - 'internal/operations/TODO.html'
      - 'reports/*.md'
      - 'apps/ai-copilot/src/context/ifr-knowledge.ts'
      - 'apps/ai-copilot/server/wiki-rag.ts'
      - 'scripts/test-liquidity-*'
      - 'apps/ai-copilot/src/context/wiki-content.json'
      - 'scripts/build-wiki-rag.js'
      - 'scripts/check-links.js'
      - 'scripts/test-check-links.cjs'
      - 'scripts/test-benefits-doc-consistency.cjs'
      - 'scripts/test-content-trust.cjs'
      - 'scripts/test-status-baseline.cjs'
      - 'scripts/test-functionality-status.cjs'
      - 'scripts/test-docs-workflow.cjs'
      - 'scripts/check-markdownlint-baseline.cjs'
      - 'scripts/test-markdownlint-baseline.cjs'
      - 'scripts/test-workflow-triggers.cjs'
      - 'scripts/test-roadmap-status-sync.cjs'
      - 'scripts/test-wiki-head-integrity.cjs'
      - 'scripts/test-wiki-jsonld.cjs'
      - 'scripts/test-surface-routing.cjs'
      - 'scripts/test-security-reporting-config.cjs'
      - 'scripts/check-browser-ethers6.cjs'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/browser/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-validator.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**/*.md'
      - 'audit/markdownlint-baseline.json'
      - 'internal/operations/TODO.md'
      - 'internal/operations/TODO.html'
      - 'reports/*.md'
      - 'apps/ai-copilot/src/context/ifr-knowledge.ts'
      - 'apps/ai-copilot/server/wiki-rag.ts'
      - 'scripts/test-liquidity-*'
      - 'apps/ai-copilot/src/context/wiki-content.json'
      - 'scripts/build-wiki-rag.js'
      - 'scripts/check-links.js'
      - 'scripts/test-check-links.cjs'
      - 'scripts/test-benefits-doc-consistency.cjs'
      - 'scripts/test-content-trust.cjs'
      - 'scripts/test-status-baseline.cjs'
      - 'scripts/test-functionality-status.cjs'
      - 'scripts/test-docs-workflow.cjs'
      - 'scripts/check-markdownlint-baseline.cjs'
      - 'scripts/test-markdownlint-baseline.cjs'
      - 'scripts/test-workflow-triggers.cjs'
      - 'scripts/test-roadmap-status-sync.cjs'
      - 'scripts/test-wiki-head-integrity.cjs'
      - 'scripts/test-surface-routing.cjs'
      - 'scripts/test-security-reporting-config.cjs'
      - 'scripts/check-browser-ethers6.cjs'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/browser/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-validator.yml'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  validate-markdown:
    name: Markdown Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.0'

      - name: Install pinned docs tooling
        run: npm ci --ignore-scripts

      - name: Test Markdown baseline policy
        run: npm run test:markdownlint-baseline

      - name: Enforce Markdown baseline
        run: npm run check:markdownlint

  validate-json:
    name: JSON Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate JSON files in docs
        run: |
          EXIT=0
          for f in $(find docs -name '*.json' 2>/dev/null); do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error file=$f::Invalid JSON: $f"
              EXIT=1
            else
              echo "✓ $f"
            fi
          done
          exit $EXIT

      - name: Validate Wiki JSON-LD
        run: npm run test:wiki-jsonld

  validate-links:
    name: Internal Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Check internal documentation links
        run: npm run test:links

  validate-structure:
    name: Docs Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'

      - name: Check required doc files exist
        run: |
          EXIT=0
          for required in docs/WHITEPAPER.md docs/ROADMAP.md docs/CHANGELOG.md docs/SECURITY_POLICY.md; do
            if [ -f "$required" ]; then
              echo "✓ $required"
            else
              echo "::warning::Missing recommended file: $required"
            fi
          done

      - name: Check for empty doc files
        run: |
          EMPTY=0
          for f in docs/*.md; do
            [ -f "$f" ] || continue
            if [ ! -s "$f" ]; then
              echo "::warning file=$f::Empty file: $f"
              EMPTY=$((EMPTY+1))
            fi
          done
          echo "Found $EMPTY empty doc files"

      - name: Check Benefits documentation consistency
        run: npm run test:benefits-docs

      - name: Check Docs workflow contract
        run: npm run test:docs-ci

      - name: Check workflow trigger contracts
        run: npm run test:workflow-triggers

      - name: Check roadmap and status consistency
        run: npm run test:roadmap-status-sync

      - name: Check public content trust
        run: npm run test:content-trust

      - name: Check CEX fee-exemption policy consistency
        run: npm run test:cex-fee-policy

      - name: Check current status baseline
        run: npm run test:status-baseline

      - name: Check current functionality matrix
        run: npm run test:functionality-status

      - name: Check Wiki RAG freshness
        run: npm run test:wiki-rag

      - name: Check Wiki head integrity
        run: npm run test:wiki-heads

      - name: Check read-only liquidity math and integration
        run: |
          node scripts/test-liquidity-guide.mjs
          node scripts/test-liquidity-gauge.mjs
          node scripts/test-liquidity-integration.cjs

      - name: Check security reporting configuration
        run: npm run test:security-reporting

      - name: Check public surface routing
        run: npm run test:surface-routing

      - name: Check browser Ethers 6 baseline
        run: npm run test:browser-ethers6

  validate-wallet-browser:
    name: Wallet Browser Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run landing/wiki wallet suite
        run: npm run test:wallet-connect

      - name: Run read-only liquidity browser and wizard suite
        run: node scripts/test-liquidity-browser.mjs

      - name: Run governance disclosure and deep-link suite
        run: node scripts/test-governance-navigation.cjs

      - name: Run Web3 write-flow suite
        run: npm run test:web3-write

  docs-summary:
    name: Docs Summary
    runs-on: ubuntu-latest
    needs: [validate-markdown, validate-json, validate-links, validate-structure, validate-wallet-browser]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Docs Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Markdown Lint | ${{ needs.validate-markdown.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| JSON Validation | ${{ needs.validate-json.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Internal Links | ${{ needs.validate-links.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Structure | ${{ needs.validate-structure.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Wallet Browser Suite | ${{ needs.validate-wallet-browser.result }} |" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ needs.validate-markdown.result }}" != "success" ||
                "${{ needs.validate-json.result }}" != "success" ||
                "${{ needs.validate-links.result }}" != "success" ||
                "${{ needs.validate-structure.result }}" != "success" ||
                "${{ needs.validate-wallet-browser.result }}" != "success" ]]; then
            echo "One or more documentation checks failed."
            exit 1
          fi
