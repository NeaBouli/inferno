name: IFR Benefits Verify CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/benefits-verify/**'
      - 'docs/specs/**'
      - 'test/BenefitsVerify.test.js'
      - '.github/workflows/benefits-verify-ci.yml'
  pull_request:
    paths:
      - 'apps/benefits-verify/**'
      - 'docs/specs/**'
      - 'test/BenefitsVerify.test.js'
      - '.github/workflows/benefits-verify-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    defaults:
      run:
        working-directory: apps/benefits-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: apps/benefits-verify/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: git diff --exit-code -- dist
