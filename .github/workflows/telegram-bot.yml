name: Telegram Bot CI

on:
  push:
    paths:
      - 'apps/telegram/telegram-bot/**'
      - '.github/workflows/telegram-bot.yml'
  pull_request:
    paths:
      - 'apps/telegram/telegram-bot/**'
      - '.github/workflows/telegram-bot.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/telegram/telegram-bot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/telegram/telegram-bot/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:syntax
      - run: npm audit signatures
      - run: npm audit --audit-level=critical
