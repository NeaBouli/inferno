name: Creator Gateway CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/creator-gateway/**'
      - '.github/workflows/creator-gateway.yml'
      - 'scripts/check-dev-advisory-exceptions.cjs'
  pull_request:
    paths:
      - 'apps/creator-gateway/**'
      - '.github/workflows/creator-gateway.yml'
      - 'scripts/check-dev-advisory-exceptions.cjs'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/creator-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/creator-gateway/package-lock.json
      - run: npm ci
      - name: npm audit (production clean; reviewed dev-only exceptions)
        run: node ../../scripts/check-dev-advisory-exceptions.cjs
      - run: npm run test:dependencies
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
