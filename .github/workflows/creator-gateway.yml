name: Creator Gateway CI

on:
  push:
    paths:
      - 'apps/creator-gateway/**'
  pull_request:
    paths:
      - 'apps/creator-gateway/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/creator-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/creator-gateway/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run test:dependencies
      - run: npx tsc --noEmit
      - run: npm test
