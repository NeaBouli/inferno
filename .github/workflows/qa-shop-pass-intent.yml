name: QA Shop Pass Intent LAST CONTROL_ONLY 3 OF 3

# Last shared-budget slot; no application/package/browser admission.
# No app/pass-suite source is changed by this QA branch.
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/qa-shop-pass-intent.yml'
      - 'scripts/qa-shop-pass-intent.cjs'
      - 'tests/fixtures/qa-shop-pass-intent-20261114.patch'

permissions:
  contents: read

concurrency:
  group: qa-shop-pass-intent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  focused:
    name: Last-slot CONTROL_ONLY bootstrap diagnostic
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.action == 'opened' &&
          github.repository == 'NeaBouli/inferno' &&
          github.event.repository.full_name == 'NeaBouli/inferno' &&
          github.event.repository.private == false &&
          toJSON(github.event.repository.private) == 'false' &&
          github.event.pull_request.head.repo.full_name == 'NeaBouli/inferno' &&
          github.event.pull_request.head.ref == 'agent/codex/shop-pass-intent-qa-20261114' &&
          github.event.pull_request.draft == true &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_SHOP_HELPER_SHA256: bf02370c3f322c89fb0f9e17b9a52618bc076bbc3164e47ec4ce373730809d4a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: CONTROL_ONLY source/bootstrap; no package or browser acquisition
        run: node scripts/qa-shop-pass-intent.cjs
      - name: Sanitized source, tool, result and cleanup receipts only
        if: ${{ always() }}
        # New official pin supplied by Parent metadata review; not a repo-existing pin.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-shop-pass-intent-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-shop-pass-intent-${{ github.run_id }}-${{ github.run_attempt }}/public/*.json
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: false
