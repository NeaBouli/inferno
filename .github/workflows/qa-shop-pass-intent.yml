name: QA Shop Pass Intent ONE CONTROL_ONLY TRANSPORT

# One-control transport source; no application/package/browser admission.
# No app/pass-suite source is changed by this QA branch.
on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/qa-shop-pass-intent.yml'
      - 'scripts/qa-shop-pass-intent.cjs'
      - 'tests/fixtures/qa-shop-pass-intent-20261114.patch'

permissions:
  contents: read

concurrency:
  group: qa-shop-pass-intent-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  focused:
    name: One CONTROL_ONLY bootstrap with structured receipts
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.event.action == 'opened' &&
          github.repository == 'NeaBouli/inferno' &&
          github.event.repository.full_name == 'NeaBouli/inferno' &&
          github.event.repository.private == false &&
          toJSON(github.event.repository.private) == 'false' &&
          github.event.pull_request.head.repo.full_name == 'NeaBouli/inferno' &&
          github.event.pull_request.head.ref == 'agent/codex/shop-pass-intent-qa-20261114' &&
          github.event.pull_request.draft == true &&
          github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_SHOP_HELPER_SHA256: e0f395acff4030394bd5d5951a8eef07482603a8fad8d12a1619f3db1b79f397
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - name: CONTROL_ONLY source/bootstrap; no package or browser acquisition
        run: |
          node="$(command -v node)"
          test "${node#/}" != "$node"
          exec /usr/bin/env -i PATH=/usr/bin:/bin LANG=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            QA_SHOP_HELPER_SHA256="$QA_SHOP_HELPER_SHA256" "$node" scripts/qa-shop-pass-intent.cjs
