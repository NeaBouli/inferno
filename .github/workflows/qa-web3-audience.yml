name: QA Web3 Current Audience Hosted Chrome Qualification

# Exact current-product application qualification after Parent admission; no fallback or retry.

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/qa-web3-audience.yml'
      - 'scripts/qa-web3-audience-visual.cjs'
      - 'tests/fixtures/web3-audience-fonts-20261114.json'

permissions:
  contents: read

jobs:
  audience-visual:
    name: One exact current Web3 hosted Chrome qualification
    if: >-
      github.repository == 'NeaBouli/inferno' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/codex/web3-tabs-visual-qa-20261114' &&
      github.event.pull_request.draft == true && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
          check-latest: false
          package-manager-cache: false
      - name: Fresh private attempt and bounded toolchain setup
        timeout-minutes: 7
        shell: bash
        env:
          QA_ROOT: ${{ runner.temp }}/web3-audience-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$QA_ROOT"
          mkdir -m 700 "$QA_ROOT"
          mkdir -m 700 "$QA_ROOT"/{out,home,tmp,fonts,input,shm}
          install -m 600 /dev/null "$QA_ROOT/user.npmrc"
          install -m 600 /dev/null "$QA_ROOT/global.npmrc"
          printf '%s\n' '{"status":"SETUP_INCOMPLETE","runtime":"NOT_RUN"}' > "$QA_ROOT/out/SETUP-STARTED.json"
          /usr/bin/grep -Fxq 'const CONTROL_ONLY = false;' scripts/qa-web3-audience-visual.cjs
          N="$(command -v node)"
          /usr/bin/env -i PATH=/usr/bin:/bin "$N" --no-addons - "$QA_ROOT" > /dev/null 2>&1 <<'NODE'
          'use strict';
          const fs = require('node:fs'), check = ok => { if (!ok) throw 0; };
          const { spawnSync } = require('node:child_process');
          const same = (a, b, keys) => keys.every(key => a[key] === b[key]);
          const keys = ['dev', 'ino', 'uid', 'gid', 'mode', 'nlink', 'rdev', 'size', 'blksize', 'blocks', 'mtimeNs', 'ctimeNs', 'birthtimeNs'];
          const targets = [['OPT', '/opt', true], ['VENDOR_DIR', '/opt/google', true], ['CHROME_DIR', '/opt/google/chrome', true], ['EXECUTABLE', '/opt/google/chrome/chrome', false]];
          const roles = Object.fromEntries(targets.map(([role]) => [role, 'NOT_REACHED'])), changedRoles = [];
          const held = [], statOptions = { bigint: true };
          let stage = 'CONTEXT', role = null, failure = null, failureRole = null, cleanupFailed = false, output;
          try {
            check(process.platform === 'linux' && process.version === 'v22.22.2' && process.getuid() > 0 && process.getuid() === process.geteuid() && process.getgid() === process.getegid());
            check(process.argv.length === 3 && /^\/home\/runner\/work\/_temp\/web3-audience-\d+-1$/.test(process.argv[2]));
            check(['O_RDONLY', 'O_DIRECTORY', 'O_NOFOLLOW', 'O_NONBLOCK', 'O_WRONLY', 'O_CREAT', 'O_EXCL'].every(key => Number.isInteger(fs.constants[key])));
            stage = 'OUTPUT_DIRECTORY';
            for (const path of [process.argv[2], process.argv[2] + '/out']) {
              const st = fs.lstatSync(path, statOptions);
              check(st.isDirectory() && !st.isSymbolicLink() && st.uid === BigInt(process.getuid()) && st.gid === BigInt(process.getgid()) && (st.mode & 0o7777n) === 0o700n && fs.realpathSync(path) === path);
            }
            output = process.argv[2] + '/out/OPT-HARDENING.json';
            stage = 'PATH_QUALIFICATION';
            // Fresh dedicated hosted VM, no untrusted root writer; metadata is not content provenance.
            for (const [pathRole, path, directory] of [['ROOT', '/', true], ['USR', '/usr', true], ['USR_BIN', '/usr/bin', true], ['SUDO', '/usr/bin/sudo', false], ['CHMOD', '/usr/bin/chmod', false], ...targets]) {
              role = pathRole;
              const before = fs.lstatSync(path, statOptions);
              check(!before.isSymbolicLink() && (directory ? before.isDirectory() : before.isFile()) && before.uid === 0n && fs.realpathSync(path) === path);
              if (!Object.hasOwn(roles, role)) check((before.mode & 0o022n) === 0n);
              if (!directory) check(before.size > 0n && (before.mode & 0o111n) === 0o111n && (before.mode & 0o7000n) === (path === '/usr/bin/sudo' ? 0o4000n : 0n));
              const fd = fs.openSync(path, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK | (directory ? fs.constants.O_DIRECTORY : 0));
              held.push({ role, path, fd, before });
              check(held.slice(0, -1).every(item => item.before.dev !== before.dev || item.before.ino !== before.ino));
              check(same(before, fs.fstatSync(fd, statOptions), keys) && same(before, fs.lstatSync(path, statOptions), keys) && fs.realpathSync(path) === path);
            }
            for (let index = 5; index < held.length; index++) {
              const target = held[index], parent = held[index === 5 ? 0 : index - 1];
              stage = 'PATH_RECHECK';
              for (const { role: pathRole, path, fd, before } of held) {
                role = pathRole;
                check(same(before, fs.fstatSync(fd, statOptions), keys) && same(before, fs.lstatSync(path, statOptions), keys) && fs.realpathSync(path) === path);
              }
              role = parent.role;
              check((parent.before.mode & 0o022n) === 0n);
              role = target.role;
              const changed = (target.before.mode & 0o022n) !== 0n;
              if (changed) {
                stage = 'COREUTILS_CALL';
                roles[role] = 'ATTEMPTED_UNVERIFIED';
                const result = spawnSync('/usr/bin/sudo', ['-n', '--', '/usr/bin/chmod', '--', 'go-w', target.path], {
                  shell: false, env: {}, timeout: 10000, killSignal: 'SIGKILL', maxBuffer: 4096, stdio: ['ignore', 'pipe', 'pipe']
                });
                check(!result.error && result.status === 0 && result.signal === null && result.stdout.length === 0 && result.stderr.length === 0);
              }
              stage = 'PATH_RECHECK';
              for (const item of held) {
                role = item.role;
                const { path, fd, before } = item, after = fs.fstatSync(fd, statOptions), named = fs.lstatSync(path, statOptions);
                const mutable = item === target && changed;
                check(same(before, after, mutable ? keys.filter(key => key !== 'mode' && key !== 'ctimeNs') : keys));
                check(after.mode === (item === target ? before.mode & ~0o022n : before.mode));
                check(same(after, named, keys) && fs.realpathSync(path) === path);
                if (item === target) {
                  target.before = after;
                  roles[role] = changed ? 'CHANGE_VERIFIED' : 'ALREADY_RESTRICTED';
                  if (changed) changedRoles.push(role);
                }
              }
            }
            stage = 'PATH_RECHECK';
            for (const { role: pathRole, path, fd, before } of held) {
              role = pathRole;
              check((before.mode & 0o022n) === 0n && same(before, fs.fstatSync(fd, statOptions), keys) && same(before, fs.lstatSync(path, statOptions), keys) && fs.realpathSync(path) === path);
            }
          } catch { failure = stage; failureRole = role; }
          finally {
            for (const { role: pathRole, fd } of held.reverse()) {
              try { fs.closeSync(fd); }
              catch { cleanupFailed = true; if (failure === null) { failure = 'FD_CLOSE'; failureRole = pathRole; } }
            }
          }
          // No raw errors or child streams; an absent/unwritable receipt is also a setup HOLD.
          try {
            check(output !== undefined);
            fs.writeFileSync(output, JSON.stringify({
              status: failure === null ? 'CHROME_PATHS_RESTRICTED' : 'HOLD',
              code: failure ?? (changedRoles.length ? 'ONLY_GROUP_WORLD_WRITE_REMOVED' : 'ALREADY_RESTRICTED'),
              role: failureRole, roles, changedRoles,
              cleanupCode: cleanupFailed ? 'FD_CLOSE_FAILED' : null
            }) + '\n', { mode: 0o600, flag: fs.constants.O_WRONLY | fs.constants.O_CREAT | fs.constants.O_EXCL | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK });
          } catch { failure ??= 'OUTPUT_WRITE'; }
          process.exitCode = failure === null ? 0 : 2;
          NODE
          timeout --signal=TERM --kill-after=5s 180s env -i PATH="$PATH" HOME="$QA_ROOT/home" TMPDIR="$QA_ROOT/tmp" npm_config_userconfig="$QA_ROOT/user.npmrc" npm_config_globalconfig="$QA_ROOT/global.npmrc" npm_config_cache="$QA_ROOT/npm-cache" npm_config_fetch_retries=0 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts --no-audit --no-fund
          timeout --signal=TERM --kill-after=5s 100s env -i PATH=/usr/bin:/bin HOME="$QA_ROOT/home" TMPDIR="$QA_ROOT/tmp" PLAYWRIGHT_BROWSERS_PATH="$QA_ROOT/browsers" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC "$N" --no-addons scripts/qa-web3-audience-visual.cjs setup "$QA_ROOT"
      - name: ONE isolated exact hosted Google Chrome first qualification
        timeout-minutes: 4
        shell: bash
        env:
          QA_ROOT: ${{ runner.temp }}/web3-audience-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          N="$(command -v node)"
          set +e
          sudo -n /usr/bin/env -i PATH=/usr/bin:/bin HOME="$QA_ROOT/home" TMPDIR="$QA_ROOT/tmp" PLAYWRIGHT_BROWSERS_PATH="$QA_ROOT/browsers" LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC /usr/bin/timeout --signal=TERM --kill-after=5s 210s /usr/bin/unshare --net --mount --pid --fork --mount-proc --kill-child "$N" --no-addons "$GITHUB_WORKSPACE/scripts/qa-web3-audience-visual.cjs" namespace "$QA_ROOT"
          code=$?
          printf '{"namespaceOwnerReaped":true,"exitCode":%d,"automaticRetry":false}\n' "$code" > "$QA_ROOT/out/NAMESPACE-EXIT.json"
          exit "$code"
      - name: Sanitized current Web3 qualification evidence - visual review pending
        if: always()
        # v7.0.2; Parent reviewed official release, tag-ref commit and action.yml.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web3-current-audience-hosted-chrome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/web3-audience-${{ github.run_id }}-${{ github.run_attempt }}/out
          if-no-files-found: error
          retention-days: 3
