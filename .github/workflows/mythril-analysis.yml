name: Mythril Bounded Analysis

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'audit/mythril-config.json'
      - 'audit/requirements-mythril.in'
      - 'audit/requirements-mythril.txt'
      - 'scripts/check-mythril.cjs'
      - 'scripts/test-mythril.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mythril-analysis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'audit/mythril-config.json'
      - 'audit/requirements-mythril.in'
      - 'audit/requirements-mythril.txt'
      - 'scripts/check-mythril.cjs'
      - 'scripts/test-mythril.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mythril-analysis.yml'
  schedule:
    - cron: '23 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mythril-bounded-analysis
  cancel-in-progress: false

jobs:
  analyze-production-contracts:
    name: Analyze concrete production contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.0'
          cache: npm

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'

      - name: Install Solidity dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Mythril toolchain
        run: |
          python -m venv .mythril-venv
          .mythril-venv/bin/pip install --require-hashes \
            -r audit/requirements-mythril.txt
          .mythril-venv/bin/solc-select install 0.8.28
          .mythril-venv/bin/solc-select use 0.8.28

      - name: Verify pinned compiler artifact
        run: |
          SOLC_ARTIFACT="$HOME/.solc-select/artifacts/solc-0.8.28/solc-0.8.28"
          echo "9a0fb7e0db2c0641dbae1c5cc645dc686820c83af516226abb1c0a2f76636f25  $SOLC_ARTIFACT" | sha256sum -c
          echo "SOLC_BIN=$SOLC_ARTIFACT" >> "$GITHUB_ENV"

      - name: Test Mythril policy and workflow
        run: npm run test:mythril

      - name: Run bounded Mythril analysis
        run: npm run check:mythril
        env:
          MYTHRIL_BIN: ${{ github.workspace }}/.mythril-venv/bin/myth
          MYTHRIL_PYTHON: ${{ github.workspace }}/.mythril-venv/bin/python
