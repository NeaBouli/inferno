# web3.ifrunit.tech security headers — repository source of truth (CWA-10).
#
# Apply by including this file inside the nginx `server {}` block that serves
# web3.ifrunit.tech (static copy of docs/web3/, docs/web3-wallet-core.js,
# docs/web3-sw.js, docs/web3-manifest.webmanifest and docs/assets/).
# Discovery anchors at the web3 web root (CWA-81): infra/web3/robots.txt,
# infra/web3/sitemap.xml (same-host URLs only) and docs/llms.txt as /llms.txt.
# scripts/check-sitemap-anchors.cjs validates them.
# `always` keeps the headers on error responses too.
#
# nginx inheritance caveat: `add_header` is dropped in any nested `location`
# that defines its own `add_header`. Include this file at server level and
# repeat it in any location block that adds headers of its own.
#
# The CSP is a contract with the actual app resources (inline script/style,
# self-hosted ethers/ifr-state/WalletConnect provider, public Mainnet RPC fallback (publicnode, drpc, 1rpc),
# WalletConnect relay/modal/verify, Google/Reown Fonts).
# scripts/test-web3-headers.cjs enforces both the header set and that
# contract — update the test and the app together when resources change.
# The GitHub Pages apex /web3/ cannot set custom headers (platform limit).

# Preserve origin/main enforcement until the JUL-11 real-wallet matrix passes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://explorer-api.walletconnect.com https://*.walletconnect.com; connect-src 'self' https://ethereum-rpc.publicnode.com https://eth.drpc.org https://1rpc.io https://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.com wss://*.walletconnect.org https://*.web3modal.org https://*.web3modal.com; frame-src https://verify.walletconnect.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.reown.com; img-src 'self' data: blob: https://ifrunit.tech https://api.web3modal.org; connect-src 'self' https://ethereum-rpc.publicnode.com https://eth.drpc.org https://1rpc.io https://rpc.walletconnect.org https://relay.walletconnect.org wss://relay.walletconnect.org https://verify.walletconnect.com https://verify.walletconnect.org https://api.web3modal.org; frame-src https://verify.walletconnect.com https://verify.walletconnect.org; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
