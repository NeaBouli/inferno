# Compose does not use service env_file values for ${...} interpolation.
# Run this file with: docker compose --env-file .env.benefits -f docker-compose.production.example.yml ...
services:
  benefits-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inferno-benefits-backend
    env_file:
      - ./.env.benefits
    environment:
      DATABASE_URL: file:/data/benefits.db
      PORT: "3001"
      RATE_LIMIT_STORE: memory
      BACKEND_REPLICA_COUNT: "1"
    volumes:
      - benefits-data:/data
    restart: unless-stopped
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3001/ready | grep -q '\"status\":\"ready\"'"]
      interval: 30s
      timeout: 5s
      retries: 3

  benefits-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BENEFITS_API_INTERNAL_URL: http://benefits-backend:3001
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-}"
        NEXT_PUBLIC_CHAIN_ID: "${NEXT_PUBLIC_CHAIN_ID:-1}"
        NEXT_PUBLIC_IFR_TOKEN_ADDRESS: "${NEXT_PUBLIC_IFR_TOKEN_ADDRESS:-0x77e99917Eca8539c62F509ED1193ac36580A6e7B}"
        NEXT_PUBLIC_IFRLOCK_ADDRESS: "${NEXT_PUBLIC_IFRLOCK_ADDRESS:-0x769928aBDfc949D0718d8766a1C2d7dBb63954Eb}"
        NEXT_PUBLIC_COMMITMENT_VAULT_ADDRESS: "${NEXT_PUBLIC_COMMITMENT_VAULT_ADDRESS:-0x0719d9eb28dF7f5e63F91fAc4Bbb2d579C4F73d3}"
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: "${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}"
    container_name: inferno-benefits-frontend
    env_file:
      - ./.env.benefits
    environment:
      BENEFITS_API_INTERNAL_URL: http://benefits-backend:3001
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      benefits-backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  benefits-data:
