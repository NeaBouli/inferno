<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F1E8" />
    <title>Offline | IFR Benefits</title>
    <style>
      /* Static, self-contained offline fallback. Tokens mirror the light shop design in src/app/globals.css
         (.shop-shell); no fonts, scripts or other resources are fetched. Typography uses fixed px sizes (nothing
         scales with the viewport) and zero letter-spacing on all text. */
      :root {
        --shop-paper: #f5f1e8;
        --shop-panel: #fffdf8;
        --shop-panel-soft: #eee8dd;
        --shop-ink: #211c17;
        --shop-muted: #675d54;
        --shop-border: #d7ccbb;
        --shop-ember: #b0481e;
        --shop-ember-deep: #8f3519;
        color-scheme: light;
        font-family: "IBM Plex Sans", "Avenir Next", Avenir, Helvetica, sans-serif;
        font-size: 16px;
        letter-spacing: 0;
        background: var(--shop-paper);
        color: var(--shop-ink);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          linear-gradient(rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.58)),
          repeating-linear-gradient(90deg, rgba(67, 54, 42, 0.018) 0, rgba(67, 54, 42, 0.018) 1px, transparent 1px, transparent 7px),
          var(--shop-paper);
        color: var(--shop-ink);
      }

      main {
        width: min(100%, 560px);
        padding: 40px 28px;
        border: 1px solid var(--shop-border);
        border-radius: 24px;
        background: var(--shop-panel);
        box-shadow: 0 18px 48px rgba(79, 59, 43, 0.13);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        border: 1px solid rgba(176, 72, 30, 0.2);
        border-radius: 50%;
        box-shadow: 0 5px 16px rgba(176, 72, 30, 0.14);
      }

      p:first-of-type {
        margin: 20px 0 8px;
        color: var(--shop-ember);
        font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Newsreader, Georgia, "Times New Roman", serif;
        font-size: 34px;
        font-weight: 600;
        line-height: 1.05;
        color: var(--shop-ink);
      }

      p {
        margin: 18px auto 0;
        color: var(--shop-muted);
        font-size: 16px;
        line-height: 1.65;
      }

      nav {
        display: grid;
        gap: 12px;
        margin-top: 30px;
      }

      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 18px;
        border: 1px solid var(--shop-border);
        border-radius: 14px;
        background: var(--shop-panel-soft);
        color: var(--shop-ink);
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        border-color: var(--shop-ember);
      }

      a:first-child {
        background: var(--shop-ember);
        border-color: var(--shop-ember);
        color: #fffdf8;
      }

      a:first-child:hover {
        background: var(--shop-ember-deep);
      }

      a:focus-visible {
        outline: 3px solid rgba(176, 72, 30, 0.32);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/ifr-token-192-v11.png" alt="Inferno IFR" width="72" height="72" />
      <p>IFR Benefits Network</p>
      <h1>You're offline</h1>
      <p>
        This page needs a connection to load current offers and verify IFR access.
        Your wallet and tokens are unchanged.
      </p>
      <nav aria-label="Offline actions">
        <a href="/">Open the offline app</a>
        <a href="">Try this page again</a>
        <a href="/support">Open support when online</a>
      </nav>
    </main>
  </body>
</html>
